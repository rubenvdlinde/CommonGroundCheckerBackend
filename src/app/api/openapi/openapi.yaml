openapi: "3.1.0"
info:
  title: "CommonGroundChecker API"
  version: "1.0.0"
  description: "Machine-readable API description for repository metadata, analysis results, and scoring configuration."
servers:
  - url: "http://localhost:3000"
    description: "Local development server"
paths:
  /api/openapi:
    get:
      summary: "Retrieve the OpenAPI specification"
      responses:
        "200":
          description: "OpenAPI document"
          content:
            application/json:
              schema:
                type: object
  /api/repositories:
    get:
      summary: "List known repositories with latest summary"
      parameters:
        - name: limit
          in: query
          description: "Maximum number of repositories to return"
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 12
      responses:
        "200":
          description: "Repository summary list"
          content:
            application/json:
              schema:
                type: object
                properties:
                  repositories:
                    type: array
                    items:
                      $ref: "#/components/schemas/RepoSummary"
    post:
      summary: "Create or update repository metadata"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepoMetadata"
      responses:
        "200":
          description: "Repository metadata saved"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoSummary"
        "400":
          description: "Invalid repository metadata"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/repositories/export:
    get:
      summary: "Export repository analysis history as CSV"
      responses:
        "200":
          description: "CSV export of repository analysis history"
          content:
            text/csv:
              schema:
                type: string
  /api/repositories/{repoId}/analyses:
    post:
      summary: "Create a new analysis result for an existing repository"
      parameters:
        - name: repoId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepoAnalysisInput"
      responses:
        "201":
          description: "Analysis result created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoAnalysisOutput"
        "400":
          description: "Invalid analysis payload"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Repository not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/repositories/{repoId}/follow:
    put:
      summary: "Follow or unfollow a repository for scheduled rescans"
      description: "Admin only. Requires `Authorization: Bearer <ADMIN_TOKEN>`. Disabled with 503 when the backend has no ADMIN_TOKEN configured."
      security:
        - adminToken: []
      parameters:
        - name: repoId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FollowSettingsInput"
      responses:
        "200":
          description: "Follow settings saved"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowSettings"
        "400":
          description: "Invalid follow settings"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Missing or invalid admin token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Repository not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: "Admin actions are disabled because ADMIN_TOKEN is not configured"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/repositories/{repoId}/retire:
    put:
      summary: "Retire a repository, or undo it"
      description: "Admin only. Requires `Authorization: Bearer <ADMIN_TOKEN>`. A retired repository keeps its history and is not rescanned on schedule until it is un-retired. Disabled with 503 when the backend has no ADMIN_TOKEN configured."
      security:
        - adminToken: []
      parameters:
        - name: repoId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetireInput"
      responses:
        "200":
          description: "Retirement saved"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetireState"
        "400":
          description: "Invalid request: retired is not a boolean, or the reason is missing or longer than 500 characters"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Missing or invalid admin token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Repository not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: "Admin actions are disabled because ADMIN_TOKEN is not configured"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/repositories/{repoId}/usage:
    get:
      summary: "Declared users and the SLAs of a repository"
      description: "Declared users are the organisations under usedBy in publiccode.yml of the latest analysis."
      parameters:
        - name: repoId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Usage status"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageStatus"
        "404":
          description: "Repository not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/repositories/{repoId}/usage/slas:
    post:
      summary: "Record an SLA for a repository"
      description: "Admin only. Requires `Authorization: Bearer <ADMIN_TOKEN>`. Disabled with 503 when the backend has no ADMIN_TOKEN configured."
      security:
        - adminToken: []
      parameters:
        - name: repoId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SlaInput"
      responses:
        "201":
          description: "SLA recorded"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageStatus"
        "400":
          description: "Invalid SLA"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Missing or invalid admin token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Repository not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: "Admin actions are disabled because ADMIN_TOKEN is not configured"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/repositories/{repoId}/usage/slas/{slaId}:
    delete:
      summary: "Remove an SLA"
      description: "Admin only. Requires `Authorization: Bearer <ADMIN_TOKEN>`. Disabled with 503 when the backend has no ADMIN_TOKEN configured."
      security:
        - adminToken: []
      parameters:
        - name: repoId
          in: path
          required: true
          schema:
            type: string
        - name: slaId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "SLA removed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageStatus"
        "401":
          description: "Missing or invalid admin token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "SLA not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: "Admin actions are disabled because ADMIN_TOKEN is not configured"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/organisations:
    get:
      summary: "Organisations that use followed components"
      description: "Aggregated over the latest analysis of every followed repository, from the organisations under usedBy in publiccode.yml. Names group when they are equal after trimming, collapsing whitespace and ignoring case. Sorted by name; there is no ranking."
      responses:
        "200":
          description: "Organisations and possible duplicates"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganisationList"
  /api/organisations/{slug}:
    get:
      operationId: getApiOrganisation
      summary: "The followed components an organisation uses"
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "The organisation and its components, sorted by repository name"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganisationDetail"
        "404":
          description: "Organisation not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/webhook:
    post:
      summary: "Register a repository for scheduled rescans or trigger a rescan"
      description: >-
        `register` needs `Authorization: Bearer <WEBHOOK_ADMIN_TOKEN>`. It follows the
        repository, returns a new repository token (only once; a second register rotates it)
        and queues an immediate rescan. `rescan` needs the repository token (or the admin
        token) and queues an immediate rescan. At most one rescan per repository is queued at
        a time.
      security:
        - webhookToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookRequest"
      responses:
        "202":
          description: "Rescan queued, or already queued"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookResponse"
        "400":
          description: "Invalid webhook payload"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Missing or invalid token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Repository not found (rescan)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: "Registration is disabled because WEBHOOK_ADMIN_TOKEN is not configured"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/repositories/{repoId}/drops:
    get:
      summary: "List the drops of a repository, newest first"
      description: "A drop is a criterion that went from pass to fail, a rating that lost a star, or the lost verdict \"suitable for Common Ground\", measured against the previous analysis of the same scanned ref kind. A drop resolves when a later analysis recovers it."
      parameters:
        - name: repoId
          in: path
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum:
              - open
              - all
            default: all
      responses:
        "200":
          description: "The drops, at most 100"
          content:
            application/json:
              schema:
                type: object
                properties:
                  drops:
                    type: array
                    items:
                      $ref: "#/components/schemas/MaintenanceDrop"
                required:
                  - drops
        "400":
          description: "Invalid state"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Repository not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/repo-history:
    get:
      summary: "Return analysis history for a repository"
      parameters:
        - name: owner
          in: query
          required: true
          schema:
            type: string
        - name: repo
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: "Repository history"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoHistoryResponse"
  /api/admin/scoring:
    get:
      summary: "Retrieve current scoring configuration"
      responses:
        "200":
          description: "Current scoring configuration"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoringConfigResponse"
    post:
      summary: "Save scoring configuration snapshot"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reset:
                  type: boolean
                criterionWeights:
                  type: object
                  additionalProperties:
                    type: number
                categoryWeights:
                  type: object
                  additionalProperties:
                    type: number
                criterionRequirementLevels:
                  type: object
                  additionalProperties:
                    type: string
                    enum:
                      - mandatory
                      - recommended
                complexityThreshold:
                  type: number
                complexityMaxCcnThreshold:
                  type: number
                spectralRulesetSource:
                  type: string
                fixTerms:
                  $ref: "#/components/schemas/FixTerms"
                kpiTargets:
                  $ref: "#/components/schemas/KpiTargets"
                slaTerms:
                  $ref: "#/components/schemas/SlaTerms"
      responses:
        "200":
          description: "Saved scoring configuration snapshot"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoringConfigResponse"
components:
  securitySchemes:
    adminToken:
      type: http
      scheme: bearer
      description: "The backend's ADMIN_TOKEN environment variable"
    webhookToken:
      type: http
      scheme: bearer
      description: "A repository token returned by register, or the WEBHOOK_ADMIN_TOKEN environment variable"
  schemas:
    WebhookRequest:
      type: object
      properties:
        repoUrl:
          type: string
        action:
          type: string
          enum:
            - register
            - rescan
        checkIntervalHours:
          type: integer
          description: "register only: 24 (daily), 168 (weekly, the default) or 720 (monthly)"
        scanRef:
          type:
            - string
            - null
          description: "register only: the branch or tag scheduled scans use; empty for the released version, \"default-branch\", \"latest-release\", or a branch or tag name"
        full:
          type: boolean
          description: "rescan only: run every check, also when the scanned commit did not change"
        options:
          type: object
          description: "register only: scan options stored with the repository and sent to the checker"
          properties:
            helmChartLocations:
              type: array
              items:
                type: string
            documentationLocations:
              type: array
              items:
                type: string
            dockerLocations:
              type: array
              items:
                type: string
            apiSpecificationLocations:
              type: array
              items:
                type: string
            isRegister:
              type: boolean
      required:
        - repoUrl
        - action
    WebhookResponse:
      type: object
      properties:
        repoId:
          type: string
        status:
          type: string
          enum:
            - queued
            - already queued
        nextCheckAt:
          type:
            - string
            - null
          format: date-time
        token:
          type: string
          description: "register only: the repository token, returned once; only its sha256 hash is stored"
      required:
        - repoId
        - status
        - nextCheckAt
    FollowSettingsInput:
      type: object
      properties:
        followed:
          type: boolean
        checkIntervalHours:
          type:
            - integer
            - null
          description: "24 (daily), 168 (weekly) or 720 (monthly). Defaults to the stored interval, or 168 when following for the first time"
        scanRef:
          type:
            - string
            - null
          description: "The branch or tag scheduled scans use: null for the released version (the tag of the publiccode.yml softwareVersion, else the latest release), \"default-branch\", \"latest-release\", or a branch or tag name"
        slaLabels:
          $ref: "#/components/schemas/SlaLabels"
      required:
        - followed
    FollowSettings:
      type: object
      properties:
        id:
          type: string
        followed:
          type: boolean
          description: "Whether the repository is rescanned on a schedule"
        checkIntervalHours:
          type:
            - integer
            - null
          description: "Hours between scheduled checks: 24 (daily), 168 (weekly) or 720 (monthly)"
        scanRef:
          type:
            - string
            - null
          description: "The branch or tag scheduled scans use: null for the released version (the tag of the publiccode.yml softwareVersion, else the latest release), \"default-branch\", \"latest-release\", or a branch or tag name"
        lastCheckedAt:
          type:
            - string
            - null
          format: date-time
          description: "When the latest analysis was stored"
        nextCheckAt:
          type:
            - string
            - null
          format: date-time
          description: "When the repository is next due for a scheduled check"
        slaLabels:
          $ref: "#/components/schemas/SlaLabels"
      required:
        - id
        - followed
        - checkIntervalHours
        - scanRef
        - lastCheckedAt
        - nextCheckAt
    SlaInput:
      type: object
      properties:
        party:
          type: string
          description: "Who agreed the SLA, for example VNG"
        maintainer:
          type: string
        startsOn:
          type: string
          format: date
        until:
          type: string
          format: date
          description: "Last day the SLA applies"
        link:
          type:
            - string
            - null
          format: uri
      required:
        - party
        - maintainer
        - startsOn
        - until
    Sla:
      type: object
      properties:
        id:
          type: string
        party:
          type: string
        maintainer:
          type: string
        startsOn:
          type: string
          format: date
        until:
          type: string
          format: date
        link:
          type:
            - string
            - null
      required:
        - id
        - party
        - maintainer
        - startsOn
        - until
        - link
    UsageStatus:
      type: object
      properties:
        declaredUsers:
          type:
            - array
            - null
          items:
            type: string
          description: "Organisations under usedBy in the latest analysis, or null when it did not record them"
        declaredUserCount:
          type:
            - integer
            - null
        slas:
          type: array
          items:
            $ref: "#/components/schemas/Sla"
      required:
        - declaredUsers
        - declaredUserCount
        - slas
    OrganisationSummary:
      type: object
      properties:
        name:
          type: string
          description: "The most common spelling under usedBy"
        slug:
          type: string
        componentCount:
          type: integer
      required:
        - name
        - slug
        - componentCount
    NearDuplicate:
      type: object
      description: "Organisations listed separately whose names differ only in accents, punctuation, a prefix such as Gemeente, or one typo"
      properties:
        names:
          type: array
          items:
            type: string
        slugs:
          type: array
          items:
            type: string
      required:
        - names
        - slugs
    OrganisationList:
      type: object
      properties:
        organisations:
          type: array
          items:
            $ref: "#/components/schemas/OrganisationSummary"
        nearDuplicates:
          type: array
          items:
            $ref: "#/components/schemas/NearDuplicate"
      required:
        - organisations
        - nearDuplicates
    OrganisationAnalysis:
      type: object
      properties:
        id:
          type: string
        checkedAt:
          type: string
          format: date-time
        version:
          type:
            - string
            - null
        scannedRef:
          type:
            - string
            - null
        scannedRefKind:
          type:
            - string
            - null
        declaredUserCount:
          type:
            - integer
            - null
        score:
          type: integer
        results:
          type: array
          items:
            $ref: "#/components/schemas/CheckResult"
      required:
        - id
        - checkedAt
        - version
        - scannedRef
        - scannedRefKind
        - declaredUserCount
        - score
        - results
    OrganisationComponent:
      type: object
      properties:
        repoId:
          type: string
        owner:
          type: string
        name:
          type: string
        repoUrl:
          type: string
        retiredAt:
          type:
            - string
            - null
          format: date-time
          description: "When an admin retired the repository; null when it is not retired"
        retiredReason:
          type:
            - string
            - null
          description: "Why an admin retired the repository"
        openDropCount:
          type: integer
        overdueDropCount:
          type: integer
        nextFixBy:
          type:
            - string
            - null
          format: date-time
          description: "The earliest fix-by date of the open drops"
        slas:
          type: array
          items:
            $ref: "#/components/schemas/Sla"
        latestAnalysis:
          oneOf:
            - $ref: "#/components/schemas/OrganisationAnalysis"
            - type: "null"
      required:
        - repoId
        - owner
        - name
        - repoUrl
        - slas
        - latestAnalysis
    OrganisationDetail:
      type: object
      properties:
        organisation:
          type: object
          properties:
            name:
              type: string
            slug:
              type: string
            spellings:
              type: array
              items:
                type: string
              description: "Every spelling seen under usedBy, most common first"
            componentCount:
              type: integer
          required:
            - name
            - slug
            - spellings
            - componentCount
        components:
          type: array
          items:
            $ref: "#/components/schemas/OrganisationComponent"
      required:
        - organisation
        - components
    RetireInput:
      type: object
      properties:
        retired:
          type: boolean
        reason:
          type: string
          maxLength: 500
          description: "Required when retired is true"
      required:
        - retired
    RetireState:
      type: object
      properties:
        id:
          type: string
        retiredAt:
          type:
            - string
            - null
          format: date-time
          description: "When an admin retired the repository; null when it is not retired"
        retiredReason:
          type:
            - string
            - null
          description: "Why an admin retired the repository"
        nextCheckAt:
          type:
            - string
            - null
          format: date-time
      required:
        - id
        - retiredAt
        - retiredReason
        - nextCheckAt
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    RepoSummary:
      type: object
      properties:
        id:
          type: string
        owner:
          type: string
        name:
          type: string
        repoUrl:
          type: string
        helmChartLocations:
          type: array
          items:
            type: string
        dockerLocations:
          type: array
          items:
            type: string
        apiSpecificationLocations:
          type: array
          items:
            type: string
        documentationLocations:
          type: array
          items:
            type: string
        isRegister:
          type: boolean
          description: "Whether the repository is checked as a register; sent to the checker on scheduled rescans"
        updatedAt:
          type: string
          format: date-time
        followed:
          type: boolean
          description: "Whether the repository is rescanned on a schedule"
        checkIntervalHours:
          type:
            - integer
            - null
          description: "Hours between scheduled checks: 24 (daily), 168 (weekly) or 720 (monthly)"
        scanRef:
          type:
            - string
            - null
          description: "The branch or tag scheduled scans use: null for the released version (the tag of the publiccode.yml softwareVersion, else the latest release), \"default-branch\", \"latest-release\", or a branch or tag name"
        lastCheckedAt:
          type:
            - string
            - null
          format: date-time
          description: "When the latest analysis was stored"
        nextCheckAt:
          type:
            - string
            - null
          format: date-time
          description: "When the repository is next due for a scheduled check"
        analysisCount:
          type: integer
        openDropCount:
          type: integer
          description: "Drops not yet recovered"
        overdueDropCount:
          type: integer
          description: "Open drops past their fix-by date"
        nextFixBy:
          type:
            - string
            - null
          format: date-time
          description: "The earliest fix-by date of the open drops"
        retiredAt:
          type:
            - string
            - null
          format: date-time
          description: "When an admin retired the repository; null when it is not retired"
        retiredReason:
          type:
            - string
            - null
          description: "Why an admin retired the repository"
        slas:
          type: array
          items:
            $ref: "#/components/schemas/Sla"
          description: "Every SLA of the repository, the one that ends last first"
        latestAnalysis:
          type:
            - object
            - null
          properties:
            checkedAt:
              type: string
              format: date-time
            score:
              type: integer
            rating:
              $ref: "#/components/schemas/Rating"
            categoryRatings:
              $ref: "#/components/schemas/CategoryRatings"
            aspectRatings:
              $ref: "#/components/schemas/AspectRatings"
            endorsement:
              $ref: "#/components/schemas/Endorsement"
            checklistVersion:
              $ref: "#/components/schemas/ChecklistVersion"
            version:
              type:
                - string
                - null
              description: "The version the analysis measured"
            declaredUserCount:
              type:
                - integer
                - null
              description: "Organisations under usedBy in the scanned publiccode.yml; null when the analysis did not record them"
            developmentStatus:
              type:
                - string
                - null
              description: "developmentStatus of the scanned publiccode.yml; null when the file or the field is missing"
            standardsEvidence:
              type:
                - array
                - null
              items:
                type: string
              description: "Evidence of the Supported standards result (declared in publiccode.yml, found in OpenAPI files); null when the analysis has no such result. Only in the repository list."
      required:
        - id
        - owner
        - name
        - repoUrl
        - helmChartLocations
        - dockerLocations
        - apiSpecificationLocations
        - documentationLocations
        - updatedAt
        - followed
        - checkIntervalHours
        - scanRef
        - lastCheckedAt
        - nextCheckAt
        - analysisCount
        - latestAnalysis
    RepoMetadata:
      type: object
      properties:
        repoUrl:
          type: string
        description:
          type: string
        language:
          type: string
        stars:
          type: integer
        forks:
          type: integer
        defaultBranch:
          type: string
        topics:
          type: array
          items:
            type: string
        license:
          type: string
        version:
          type: string
        versionEvidenceSource:
          type: string
        versionEvidenceDetail:
          type: string
        helmChartLocations:
          type: array
          items:
            type: string
        dockerLocations:
          type: array
          items:
            type: string
        apiSpecificationLocations:
          type: array
          items:
            type: string
        documentationLocations:
          type: array
          items:
            type: string
        isRegister:
          type: boolean
          description: "Whether the repository is checked as a register; sent to the checker on scheduled rescans"
      required:
        - repoUrl
    CheckRequest:
      type: object
      properties:
        repoUrl:
          type: string
        helmChartLocations:
          type: array
          items:
            type: string
        documentationLocations:
          type: array
          items:
            type: string
        dockerLocations:
          type: array
          items:
            type: string
        apiSpecificationLocations:
          type: array
          items:
            type: string
        isRegister:
          type: boolean
        ref:
          type: string
          description: "The branch or tag to scan; empty for the released version, \"default-branch\" for the default branch, \"latest-release\" for the newest stable release"
      required:
        - repoUrl
    Rating:
      type:
        - number
        - null
      minimum: 0.5
      maximum: 5.5
      description: "Continuous rating from 0.5 to 5.5, shown as 1 to 5 stars; null when no criterion counts"
    CategoryRatings:
      type:
        - object
        - null
      additionalProperties:
        $ref: "#/components/schemas/Rating"
      description: "Rating per category; a category is null when none of its aspects is rated"
    AspectRating:
      type: object
      properties:
        rating:
          $ref: "#/components/schemas/Rating"
        found:
          type: integer
          minimum: 0
          description: "For a document-count aspect: the inputs that pass"
        expected:
          type: integer
          minimum: 0
          description: "For a document-count aspect: the inputs that were measured"
      required:
        - rating
    AspectRatings:
      type:
        - object
        - null
      additionalProperties:
        $ref: "#/components/schemas/AspectRating"
      description: "Rating per aspect id"
    Endorsement:
      type:
        - object
        - null
      properties:
        passed:
          type: boolean
          description: "No mandatory criterion fails and the overall rating is at least 2.5"
        reasons:
          type: array
          items:
            type: string
      required:
        - passed
        - reasons
    ScanMode:
      type:
        - string
        - null
      enum:
        - full
        - partial
        - null
      description: "full when every check ran; partial when the commit, checklist version and tools were unchanged, so the code checks were copied from an earlier analysis (each such result carries reusedFrom) and only the outside-world checks ran; null for older analyses"
    Fingerprint:
      type:
        - string
        - null
      pattern: "^[0-9a-z:]{1,80}$"
      description: "A short hash, for example sha256:0123abcd. toolFingerprint covers the checker's own version and its pinned tool versions; inputsFingerprint covers the scan settings the code checks depend on"
    ChecklistVersion:
      type:
        - string
        - null
      pattern: "^[0-9A-Za-z][0-9A-Za-z.\\-]{0,31}$"
      description: "The checklist version the analysis was measured against, for example 2026.1; null for older analyses"
    RepoAnalysisInput:
      type: object
      properties:
        scoringConfigId:
          type:
            - string
            - null
        checkedAt:
          type: string
          format: date-time
        version:
          type:
            - string
            - null
        scannedRef:
          type:
            - string
            - null
          description: "The branch or tag name that was scanned, for example development or v1.2.0"
        scannedRefKind:
          type:
            - string
            - null
          description: "Why the scanned ref was chosen: declared-version (the tag of the publiccode.yml softwareVersion), release (the newest stable release), tag (the newest stable semver tag), branch (named in the request), default-branch (asked for), or default-branch-fallback (no release found)"
        scannedCommit:
          type:
            - string
            - null
          description: "The commit SHA that was scanned"
        declaredUsers:
          type: array
          items:
            type: string
          description: "The organisations under usedBy in publiccode.yml. Leave out when the scan did not read them"
        score:
          type: integer
        rating:
          $ref: "#/components/schemas/Rating"
        categoryRatings:
          $ref: "#/components/schemas/CategoryRatings"
        aspectRatings:
          $ref: "#/components/schemas/AspectRatings"
        endorsement:
          $ref: "#/components/schemas/Endorsement"
        checklistVersion:
          $ref: "#/components/schemas/ChecklistVersion"
        scanMode:
          $ref: "#/components/schemas/ScanMode"
        scanDurationSeconds:
          type:
            - number
            - null
          minimum: 0
          description: "How long the scan took, in seconds"
        toolFingerprint:
          $ref: "#/components/schemas/Fingerprint"
        inputsFingerprint:
          $ref: "#/components/schemas/Fingerprint"
        results:
          type: array
          items:
            $ref: "#/components/schemas/CheckResult"
      required:
        - checkedAt
        - score
        - results
    RepoAnalysisOutput:
      type: object
      properties:
        id:
          type: string
        repoId:
          type: string
        scoringConfigId:
          type:
            - string
            - null
        checkedAt:
          type: string
          format: date-time
        version:
          type:
            - string
            - null
        scannedRef:
          type:
            - string
            - null
          description: "The branch or tag name that was scanned, for example development or v1.2.0"
        scannedRefKind:
          type:
            - string
            - null
          description: "Why the scanned ref was chosen: declared-version (the tag of the publiccode.yml softwareVersion), release (the newest stable release), tag (the newest stable semver tag), branch (named in the request), default-branch (asked for), or default-branch-fallback (no release found)"
        scannedCommit:
          type:
            - string
            - null
          description: "The commit SHA that was scanned"
        declaredUsers:
          type: array
          items:
            type: string
        declaredUserCount:
          type:
            - integer
            - null
          description: "Organisations under usedBy at this analysis, or null when it did not record them"
        score:
          type: integer
        rating:
          $ref: "#/components/schemas/Rating"
        categoryRatings:
          $ref: "#/components/schemas/CategoryRatings"
        aspectRatings:
          $ref: "#/components/schemas/AspectRatings"
        endorsement:
          $ref: "#/components/schemas/Endorsement"
        checklistVersion:
          $ref: "#/components/schemas/ChecklistVersion"
        scanMode:
          $ref: "#/components/schemas/ScanMode"
        scanDurationSeconds:
          type:
            - number
            - null
          minimum: 0
          description: "How long the scan took, in seconds"
        toolFingerprint:
          $ref: "#/components/schemas/Fingerprint"
        inputsFingerprint:
          $ref: "#/components/schemas/Fingerprint"
        results:
          type: array
          items:
            $ref: "#/components/schemas/CheckResult"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - repoId
        - checkedAt
        - score
        - results
        - createdAt
    RepoHistoryResponse:
      type: object
      properties:
        repository:
          type: object
          properties:
            id:
              type: string
            repoUrl:
              type: string
            owner:
              type: string
            name:
              type: string
            metadata:
              $ref: "#/components/schemas/RepoMeta"
            followed:
              type: boolean
              description: "Whether the repository is rescanned on a schedule"
            checkIntervalHours:
              type:
                - integer
                - null
              description: "Hours between scheduled checks: 24 (daily), 168 (weekly) or 720 (monthly)"
            scanRef:
              type:
                - string
                - null
              description: "The branch or tag scheduled scans use: null for the released version (the tag of the publiccode.yml softwareVersion, else the latest release), \"default-branch\", \"latest-release\", or a branch or tag name"
            lastCheckedAt:
              type:
                - string
                - null
              format: date-time
              description: "When the latest analysis was stored"
            nextCheckAt:
              type:
                - string
                - null
              format: date-time
              description: "When the repository is next due for a scheduled check"
            retiredAt:
              type:
                - string
                - null
              format: date-time
              description: "When an admin retired the repository; null when it is not retired"
            retiredReason:
              type:
                - string
                - null
              description: "Why an admin retired the repository"
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
          required:
            - id
            - repoUrl
            - owner
            - name
            - metadata
            - followed
            - checkIntervalHours
            - scanRef
            - lastCheckedAt
            - nextCheckAt
            - createdAt
            - updatedAt
        analyses:
          type: array
          items:
            $ref: "#/components/schemas/RepoAnalysisOutput"
        drops:
          type: array
          description: "The drops of the repository, newest first, at most 100"
          items:
            $ref: "#/components/schemas/MaintenanceDrop"
      required:
        - repository
        - analyses
        - drops
    ScoringConfigResponse:
      type: object
