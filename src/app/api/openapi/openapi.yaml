            - string
            - null
        complexityThreshold:
          type: integer
        complexityMaxCcnThreshold:
          type: integer
        spectralRulesetSource:
          type: string
        criterionWeights:
          type: object
          additionalProperties:
            type: number
        categoryWeights:
          type: object
          additionalProperties:
            type: number
        criterionRequirementLevels:
          type: object
          additionalProperties:
            type: string
            enum:
              - mandatory
              - recommended
        defaultCriterionWeights:
          type: object
          additionalProperties:
            type: number
        defaultCategoryWeights:
          type: object
          additionalProperties:
            type: number
        defaultCriterionRequirementLevels:
          type: object
          additionalProperties:
            type: string
            enum:
              - mandatory
              - recommended
              - informative
        defaultComplexityThreshold:
          type: integer
        defaultComplexityMaxCcnThreshold:
          type: integer
        defaultSpectralRulesetSource:
          type: string
        fixTerms:
          $ref: "#/components/schemas/FixTerms"
        kpiTargets:
          $ref: "#/components/schemas/KpiTargets"
        defaultFixTerms:
          $ref: "#/components/schemas/FixTerms"
        defaultKpiTargets:
          $ref: "#/components/schemas/KpiTargets"
        slaTerms:
          $ref: "#/components/schemas/SlaTerms"
        defaultSlaTerms:
          $ref: "#/components/schemas/SlaTerms"
      required:
        - scoringConfigId
        - complexityThreshold
        - complexityMaxCcnThreshold
        - spectralRulesetSource
        - criterionWeights
        - categoryWeights
        - criterionRequirementLevels
        - defaultCriterionWeights
        - defaultCategoryWeights
        - defaultCriterionRequirementLevels
        - defaultComplexityThreshold
        - defaultComplexityMaxCcnThreshold
        - defaultSpectralRulesetSource
    MaintenanceDrop:
      type: object
      properties:
        id:
          type: string
        repoId:
          type: string
        analysisId:
          type: string
          description: "The analysis that showed the drop"
        previousAnalysisId:
          type: string
          description: "The analysis it was compared with"
        scannedRefKind:
          type:
            - string
            - null
        checklistVersion:
          type:
            - string
            - null
          description: "The checklist version both compared analyses were measured against"
        kind:
          type: string
          enum:
            - criterion
            - rating
            - verdict
        subject:
          type: string
          description: "The criterion id, \"overall\" or a category name, or \"suitable\""
        label:
          type: string
        from:
          type: string
          description: "\"pass\", a number of stars, or \"suitable\""
        to:
          type: string
          description: "\"fail\", a number of stars, or \"not suitable\""
        detectedAt:
          type: string
          format: date-time
        fixTermDays:
          type: integer
        fixBy:
          type: string
          format: date-time
        resolvedAt:
          type:
            - string
            - null
          format: date-time
        resolvedAnalysisId:
          type:
            - string
            - null
        overdue:
          type: boolean
          description: "Open past its fix-by date"
      required:
        - id
        - repoId
        - analysisId
        - previousAnalysisId
        - scannedRefKind
        - kind
        - subject
        - label
        - from
        - to
        - detectedAt
        - fixTermDays
        - fixBy
        - resolvedAt
        - resolvedAnalysisId
        - overdue
    FixTerms:
      type: object
      description: "Days to recover a drop. The defaults are proposals until a governance decision sets the terms."
      properties:
        criteria:
          type: object
          description: "Per criterion id"
          additionalProperties:
            type: integer
        ratings:
          type: object
          description: "Per rating: overall or a category name"
          additionalProperties:
            type: integer
        mandatory:
          type: integer
        recommended:
          type: integer
        rating:
          type: integer
        verdict:
          type: integer
    SlaLabels:
      type:
        - object
        - null
      description: "Label names (lower case) mapped to an SLA category, on top of the checker's map of GitHub's default labels. Null when the repository has none."
      additionalProperties:
        type: string
        enum:
          - blocking-bug
          - bug
          - question
          - documentation
          - feature-request
          - no-fix-term
          - ignore
    SlaTerms:
      type: object
      description: "SLA response and fix terms per issue category, in working days (Monday to Friday, Europe/Amsterdam). Proposals; informative only."
      additionalProperties:
        type: object
        properties:
          respondDays:
            type:
              - integer
              - null
          fixDays:
            description: "Working days, \"next-release\", or null for no fix term"
            oneOf:
              - type: integer
              - type: string
                enum:
                  - next-release
              - type: null
    KpiTargets:
      type: object
      description: "Target values per CHAOSS metric id: at least min, at most max. Durations in hours, release frequency in releases per 12 months. Informative only; proposals."
      additionalProperties:
        type: object
        properties:
          min:
            type: number
          max:
            type: number
    RepoMeta:
      type: object
      properties:
        displayName:
          type:
            - string
            - null
        description:
          type:
            - string
            - null
        language:
          type:
            - string
            - null
        stars:
          type: integer
        forks:
          type: integer
        defaultBranch:
          type: string
        topics:
          type: array
          items:
            type: string
        license:
          type:
            - string
            - null
        version:
          type:
            - string
            - null
        versionEvidence:
          type: object
          properties:
            source:
              type: string
              enum:
                - release
                - tag
                - manifest
                - readme
                - none
            detail:
              type: string
          required:
            - source
            - detail
      required:
        - description
        - language
        - stars
        - forks
        - defaultBranch
        - topics
        - license
        - version
        - versionEvidence
    CheckResult:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        requirementLevel:
          type: string
          enum:
            - mandatory
            - recommended
            - informative
        status:
          type: string
          enum:
            - pass
            - fail
            - warn
            - info
        message:
          type: string
        evidence:
          type: array
          items:
            type: string
        referenceUrl:
          type: string
        confidence:
          type: string
          enum:
            - high
            - medium
            - low
      required:
        - id
        - title
        - description
        - status
        - message
    CheckReport:
      type: object
      properties:
        repoUrl:
          type: string
        owner:
          type: string
        repo:
          type: string
        checkedAt:
          type: string
          format: date-time
        scoringConfigId:
          type:
            - string
            - null
        score:
          type: integer
        results:
          type: array
          items:
            $ref: "#/components/schemas/CheckResult"
        repoMeta:
          $ref: "#/components/schemas/RepoMeta"
      required:
        - repoUrl
        - owner
        - repo
        - checkedAt
        - score
        - results
        - repoMeta
