openapi: "3.1.0"
info:
  title: "CommonGroundChecker API"
  version: "1.0.0"
  description: "Machine-readable API description for repository metadata, analysis results, and scoring configuration."
servers:
  - url: "http://localhost:3000"
    description: "Local development server"
paths:
  /api/openapi:
    get:
      summary: "Retrieve the OpenAPI specification"
      responses:
        "200":
          description: "OpenAPI document"
          content:
            application/json:
              schema:
                type: object
  /api/repositories:
    get:
      summary: "List known repositories with latest summary"
      parameters:
        - name: limit
          in: query
          description: "Maximum number of repositories to return"
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 12
      responses:
        "200":
          description: "Repository summary list"
          content:
            application/json:
              schema:
                type: object
                properties:
                  repositories:
                    type: array
                    items:
                      $ref: "#/components/schemas/RepoSummary"
    post:
      summary: "Create or update repository metadata"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepoMetadata"
      responses:
        "200":
          description: "Repository metadata saved"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoSummary"
        "400":
          description: "Invalid repository metadata"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/repositories/export:
    get:
      summary: "Export repository analysis history as CSV"
      responses:
        "200":
          description: "CSV export of repository analysis history"
          content:
            text/csv:
              schema:
                type: string
  /api/repositories/{repoId}/analyses:
    post:
      summary: "Create a new analysis result for an existing repository"
      parameters:
        - name: repoId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepoAnalysisInput"
      responses:
        "201":
          description: "Analysis result created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoAnalysisOutput"
        "400":
          description: "Invalid analysis payload"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Repository not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/repositories/{repoId}/follow:
    put:
      summary: "Follow or unfollow a repository for scheduled rescans"
      description: "Admin only. Requires `Authorization: Bearer <ADMIN_TOKEN>`. Disabled with 503 when the backend has no ADMIN_TOKEN configured."
      security:
        - adminToken: []
      parameters:
        - name: repoId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FollowSettingsInput"
      responses:
        "200":
          description: "Follow settings saved"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowSettings"
        "400":
          description: "Invalid follow settings"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Missing or invalid admin token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Repository not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: "Admin actions are disabled because ADMIN_TOKEN is not configured"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/webhook:
    post:
      summary: "Register a repository for scheduled rescans or trigger a rescan"
      description: >-
        `register` needs `Authorization: Bearer <WEBHOOK_ADMIN_TOKEN>`. It follows the
        repository, returns a new repository token (only once; a second register rotates it)
        and queues an immediate rescan. `rescan` needs the repository token (or the admin
        token) and queues an immediate rescan. At most one rescan per repository is queued at
        a time.
      security:
        - webhookToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookRequest"
      responses:
        "202":
          description: "Rescan queued, or already queued"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookResponse"
        "400":
          description: "Invalid webhook payload"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Missing or invalid token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Repository not found (rescan)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: "Registration is disabled because WEBHOOK_ADMIN_TOKEN is not configured"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/repositories/{repoId}/drops:
    get:
      summary: "List the drops of a repository, newest first"
      description: "A drop is a criterion that went from pass to fail, a rating that lost a star, or the lost verdict \"suitable for Common Ground\", measured against the previous analysis of the same scanned ref kind. A drop resolves when a later analysis recovers it."
      parameters:
        - name: repoId
          in: path
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum:
              - open
              - all
            default: all
      responses:
        "200":
          description: "The drops, at most 100"
          content:
            application/json:
              schema:
                type: object
                properties:
                  drops:
                    type: array
                    items:
                      $ref: "#/components/schemas/MaintenanceDrop"
                required:
                  - drops
        "400":
          description: "Invalid state"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Repository not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/repo-history:
    get:
      summary: "Return analysis history for a repository"
      parameters:
        - name: owner
          in: query
          required: true
          schema:
            type: string
        - name: repo
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: "Repository history"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoHistoryResponse"
  /api/admin/scoring:
    get:
      summary: "Retrieve current scoring configuration"
      responses:
        "200":
          description: "Current scoring configuration"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoringConfigResponse"
    post:
      summary: "Save scoring configuration snapshot"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reset:
                  type: boolean
                criterionWeights:
                  type: object
                  additionalProperties:
                    type: number
                categoryWeights:
                  type: object
                  additionalProperties:
                    type: number
                criterionRequirementLevels:
                  type: object
                  additionalProperties:
                    type: string
                    enum:
                      - mandatory
                      - recommended
                complexityThreshold:
                  type: number
                complexityMaxCcnThreshold:
                  type: number
                spectralRulesetSource:
                  type: string
                fixTerms:
                  $ref: "#/components/schemas/FixTerms"
                kpiTargets:
                  $ref: "#/components/schemas/KpiTargets"
      responses:
        "200":
          description: "Saved scoring configuration snapshot"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoringConfigResponse"
components:
  securitySchemes:
    adminToken:
      type: http
      scheme: bearer
      description: "The backend's ADMIN_TOKEN environment variable"
    webhookToken:
      type: http
      scheme: bearer
      description: "A repository token returned by register, or the WEBHOOK_ADMIN_TOKEN environment variable"
  schemas:
    WebhookRequest:
      type: object
      properties:
        repoUrl:
          type: string
        action:
          type: string
          enum:
            - register
            - rescan
        checkIntervalHours:
          type: integer
          description: "register only: 24 (daily), 168 (weekly, the default) or 720 (monthly)"
        scanRef:
          type:
            - string
            - null
          description: "register only: the branch or tag scheduled scans use; empty for the released version, \"default-branch\", \"latest-release\", or a branch or tag name"
        options:
          type: object
          description: "register only: scan options stored with the repository and sent to the checker"
          properties:
            helmChartLocations:
              type: array
              items:
                type: string
            documentationLocations:
              type: array
              items:
                type: string
            dockerLocations:
              type: array
              items:
                type: string
            apiSpecificationLocations:
              type: array
              items:
                type: string
            isRegister:
              type: boolean
      required:
        - repoUrl
        - action
    WebhookResponse:
      type: object
      properties:
        repoId:
          type: string
        status:
          type: string
          enum:
            - queued
            - already queued
        nextCheckAt:
          type:
            - string
            - null
          format: date-time
        token:
          type: string
          description: "register only: the repository token, returned once; only its sha256 hash is stored"
      required:
        - repoId
        - status
        - nextCheckAt
    FollowSettingsInput:
      type: object
      properties:
        followed:
          type: boolean
        checkIntervalHours:
          type:
            - integer
            - null
          description: "24 (daily), 168 (weekly) or 720 (monthly). Defaults to the stored interval, or 168 when following for the first time"
        scanRef:
          type:
            - string
            - null
          description: "The branch or tag scheduled scans use: null for the released version (the tag of the publiccode.yml softwareVersion, else the latest release), \"default-branch\", \"latest-release\", or a branch or tag name"
      required:
        - followed
    FollowSettings:
      type: object
      properties:
        id:
          type: string
        followed:
          type: boolean
          description: "Whether the repository is rescanned on a schedule"
        checkIntervalHours:
          type:
            - integer
            - null
          description: "Hours between scheduled checks: 24 (daily), 168 (weekly) or 720 (monthly)"
        scanRef:
          type:
            - string
            - null
          description: "The branch or tag scheduled scans use: null for the released version (the tag of the publiccode.yml softwareVersion, else the latest release), \"default-branch\", \"latest-release\", or a branch or tag name"
        lastCheckedAt:
          type:
            - string
            - null
          format: date-time
          description: "When the latest analysis was stored"
        nextCheckAt:
          type:
            - string
            - null
          format: date-time
          description: "When the repository is next due for a scheduled check"
      required:
        - id
        - followed
        - checkIntervalHours
        - scanRef
        - lastCheckedAt
        - nextCheckAt
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    RepoSummary:
      type: object
      properties:
        id:
          type: string
        owner:
          type: string
        name:
          type: string
        repoUrl:
          type: string
        helmChartLocations:
          type: array
          items:
            type: string
        dockerLocations:
          type: array
          items:
            type: string
        apiSpecificationLocations:
          type: array
          items:
            type: string
        documentationLocations:
          type: array
          items:
            type: string
        isRegister:
          type: boolean
          description: "Whether the repository is checked as a register; sent to the checker on scheduled rescans"
        updatedAt:
          type: string
          format: date-time
        followed:
          type: boolean
          description: "Whether the repository is rescanned on a schedule"
        checkIntervalHours:
          type:
            - integer
            - null
          description: "Hours between scheduled checks: 24 (daily), 168 (weekly) or 720 (monthly)"
        scanRef:
          type:
            - string
            - null
          description: "The branch or tag scheduled scans use: null for the released version (the tag of the publiccode.yml softwareVersion, else the latest release), \"default-branch\", \"latest-release\", or a branch or tag name"
        lastCheckedAt:
          type:
            - string
            - null
          format: date-time
          description: "When the latest analysis was stored"
        nextCheckAt:
          type:
            - string
            - null
          format: date-time
          description: "When the repository is next due for a scheduled check"
        analysisCount:
          type: integer
        openDropCount:
          type: integer
          description: "Drops not yet recovered"
        overdueDropCount:
          type: integer
          description: "Open drops past their fix-by date"
        latestAnalysis:
          type:
            - object
            - null
          properties:
            checkedAt:
              type: string
              format: date-time
            score:
              type: integer
            rating:
              $ref: "#/components/schemas/Rating"
            categoryRatings:
              $ref: "#/components/schemas/CategoryRatings"
            aspectRatings:
              $ref: "#/components/schemas/AspectRatings"
            endorsement:
              $ref: "#/components/schemas/Endorsement"
      required:
        - id
        - owner
        - name
        - repoUrl
        - helmChartLocations
        - dockerLocations
        - apiSpecificationLocations
        - documentationLocations
        - updatedAt
        - followed
        - checkIntervalHours
        - scanRef
        - lastCheckedAt
        - nextCheckAt
        - analysisCount
        - latestAnalysis
    RepoMetadata:
      type: object
      properties:
        repoUrl:
          type: string
        description:
          type: string
        language:
          type: string
        stars:
          type: integer
        forks:
          type: integer
        defaultBranch:
          type: string
        topics:
          type: array
          items:
            type: string
        license:
          type: string
        version:
          type: string
        versionEvidenceSource:
          type: string
        versionEvidenceDetail:
          type: string
        helmChartLocations:
          type: array
          items:
            type: string
        dockerLocations:
          type: array
          items:
            type: string
        apiSpecificationLocations:
          type: array
          items:
            type: string
        documentationLocations:
          type: array
          items:
            type: string
        isRegister:
          type: boolean
          description: "Whether the repository is checked as a register; sent to the checker on scheduled rescans"
      required:
        - repoUrl
    CheckRequest:
      type: object
      properties:
        repoUrl:
          type: string
        helmChartLocations:
          type: array
          items:
            type: string
        documentationLocations:
          type: array
          items:
            type: string
        dockerLocations:
          type: array
          items:
            type: string
        apiSpecificationLocations:
          type: array
          items:
            type: string
        isRegister:
          type: boolean
        ref:
          type: string
          description: "The branch or tag to scan; empty for the released version, \"default-branch\" for the default branch, \"latest-release\" for the newest stable release"
      required:
        - repoUrl
    Rating:
      type:
        - number
        - null
      minimum: 0.5
      maximum: 5.5
      description: "Continuous rating from 0.5 to 5.5, shown as 1 to 5 stars; null when no criterion counts"
    CategoryRatings:
      type:
        - object
        - null
      additionalProperties:
        $ref: "#/components/schemas/Rating"
      description: "Rating per category; a category is null when none of its aspects is rated"
    AspectRating:
      type: object
      properties:
        rating:
          $ref: "#/components/schemas/Rating"
        found:
          type: integer
          minimum: 0
          description: "For a document-count aspect: the inputs that pass"
        expected:
          type: integer
          minimum: 0
          description: "For a document-count aspect: the inputs that were measured"
      required:
        - rating
    AspectRatings:
      type:
        - object
        - null
      additionalProperties:
        $ref: "#/components/schemas/AspectRating"
      description: "Rating per aspect id"
    Endorsement:
      type:
        - object
        - null
      properties:
        passed:
          type: boolean
          description: "No mandatory criterion fails and the overall rating is at least 2.5"
        reasons:
          type: array
          items:
            type: string
      required:
        - passed
        - reasons
    RepoAnalysisInput:
      type: object
      properties:
        scoringConfigId:
          type:
            - string
            - null
        checkedAt:
          type: string
          format: date-time
        version:
          type:
            - string
            - null
        scannedRef:
          type:
            - string
            - null
          description: "The branch or tag name that was scanned, for example development or v1.2.0"
        scannedRefKind:
          type:
            - string
            - null
          description: "Why the scanned ref was chosen: declared-version (the tag of the publiccode.yml softwareVersion), release (the newest stable release), tag (the newest stable semver tag), branch (named in the request), default-branch (asked for), or default-branch-fallback (no release found)"
        scannedCommit:
          type:
            - string
            - null
          description: "The commit SHA that was scanned"
        score:
          type: integer
        rating:
          $ref: "#/components/schemas/Rating"
        categoryRatings:
          $ref: "#/components/schemas/CategoryRatings"
        aspectRatings:
          $ref: "#/components/schemas/AspectRatings"
        endorsement:
          $ref: "#/components/schemas/Endorsement"
        results:
          type: array
          items:
            $ref: "#/components/schemas/CheckResult"
      required:
        - checkedAt
        - score
        - results
    RepoAnalysisOutput:
      type: object
      properties:
        id:
          type: string
        repoId:
          type: string
        scoringConfigId:
          type:
            - string
            - null
        checkedAt:
          type: string
          format: date-time
        version:
          type:
            - string
            - null
        scannedRef:
          type:
            - string
            - null
          description: "The branch or tag name that was scanned, for example development or v1.2.0"
        scannedRefKind:
          type:
            - string
            - null
          description: "Why the scanned ref was chosen: declared-version (the tag of the publiccode.yml softwareVersion), release (the newest stable release), tag (the newest stable semver tag), branch (named in the request), default-branch (asked for), or default-branch-fallback (no release found)"
        scannedCommit:
          type:
            - string
            - null
          description: "The commit SHA that was scanned"
        score:
          type: integer
        rating:
          $ref: "#/components/schemas/Rating"
        categoryRatings:
          $ref: "#/components/schemas/CategoryRatings"
        aspectRatings:
          $ref: "#/components/schemas/AspectRatings"
        endorsement:
          $ref: "#/components/schemas/Endorsement"
        results:
          type: array
          items:
            $ref: "#/components/schemas/CheckResult"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - repoId
        - checkedAt
        - score
        - results
        - createdAt
    RepoHistoryResponse:
      type: object
      properties:
        repository:
          type: object
          properties:
            id:
              type: string
            repoUrl:
              type: string
            owner:
              type: string
            name:
              type: string
            metadata:
              $ref: "#/components/schemas/RepoMeta"
            followed:
              type: boolean
              description: "Whether the repository is rescanned on a schedule"
            checkIntervalHours:
              type:
                - integer
                - null
              description: "Hours between scheduled checks: 24 (daily), 168 (weekly) or 720 (monthly)"
            scanRef:
              type:
                - string
                - null
              description: "The branch or tag scheduled scans use: null for the released version (the tag of the publiccode.yml softwareVersion, else the latest release), \"default-branch\", \"latest-release\", or a branch or tag name"
            lastCheckedAt:
              type:
                - string
                - null
              format: date-time
              description: "When the latest analysis was stored"
            nextCheckAt:
              type:
                - string
                - null
              format: date-time
              description: "When the repository is next due for a scheduled check"
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
          required:
            - id
            - repoUrl
            - owner
            - name
            - metadata
            - followed
            - checkIntervalHours
            - scanRef
            - lastCheckedAt
            - nextCheckAt
            - createdAt
            - updatedAt
        analyses:
          type: array
          items:
            $ref: "#/components/schemas/RepoAnalysisOutput"
        drops:
          type: array
          description: "The drops of the repository, newest first, at most 100"
          items:
            $ref: "#/components/schemas/MaintenanceDrop"
      required:
        - repository
        - analyses
        - drops
    ScoringConfigResponse:
      type: object
      properties:
        ok:
          type: boolean
        scoringConfigId:
          type:
            - string
            - null
        complexityThreshold:
          type: integer
        complexityMaxCcnThreshold:
          type: integer
        spectralRulesetSource:
          type: string
        criterionWeights:
          type: object
          additionalProperties:
            type: number
        categoryWeights:
          type: object
          additionalProperties:
            type: number
        criterionRequirementLevels:
          type: object
          additionalProperties:
            type: string
            enum:
              - mandatory
              - recommended
        defaultCriterionWeights:
          type: object
          additionalProperties:
            type: number
        defaultCategoryWeights:
          type: object
          additionalProperties:
            type: number
        defaultCriterionRequirementLevels:
          type: object
          additionalProperties:
            type: string
            enum:
              - mandatory
              - recommended
              - informative
        defaultComplexityThreshold:
          type: integer
        defaultComplexityMaxCcnThreshold:
          type: integer
        defaultSpectralRulesetSource:
          type: string
        fixTerms:
          $ref: "#/components/schemas/FixTerms"
        kpiTargets:
          $ref: "#/components/schemas/KpiTargets"
        defaultFixTerms:
          $ref: "#/components/schemas/FixTerms"
        defaultKpiTargets:
          $ref: "#/components/schemas/KpiTargets"
      required:
        - scoringConfigId
        - complexityThreshold
        - complexityMaxCcnThreshold
        - spectralRulesetSource
        - criterionWeights
        - categoryWeights
        - criterionRequirementLevels
        - defaultCriterionWeights
        - defaultCategoryWeights
        - defaultCriterionRequirementLevels
        - defaultComplexityThreshold
        - defaultComplexityMaxCcnThreshold
        - defaultSpectralRulesetSource
    MaintenanceDrop:
      type: object
      properties:
        id:
          type: string
        repoId:
          type: string
        analysisId:
          type: string
          description: "The analysis that showed the drop"
        previousAnalysisId:
          type: string
          description: "The analysis it was compared with"
        scannedRefKind:
          type:
            - string
            - null
        kind:
          type: string
          enum:
            - criterion
            - rating
            - verdict
        subject:
          type: string
          description: "The criterion id, \"overall\" or a category name, or \"suitable\""
        label:
          type: string
        from:
          type: string
          description: "\"pass\", a number of stars, or \"suitable\""
        to:
          type: string
          description: "\"fail\", a number of stars, or \"not suitable\""
        detectedAt:
          type: string
          format: date-time
        fixTermDays:
          type: integer
        fixBy:
          type: string
          format: date-time
        resolvedAt:
          type:
            - string
            - null
          format: date-time
        resolvedAnalysisId:
          type:
            - string
            - null
        overdue:
          type: boolean
          description: "Open past its fix-by date"
      required:
        - id
        - repoId
        - analysisId
        - previousAnalysisId
        - scannedRefKind
        - kind
        - subject
        - label
        - from
        - to
        - detectedAt
        - fixTermDays
        - fixBy
        - resolvedAt
        - resolvedAnalysisId
        - overdue
    FixTerms:
      type: object
      description: "Days to recover a drop. The defaults are proposals until a governance decision sets the terms."
      properties:
        criteria:
          type: object
          description: "Per criterion id"
          additionalProperties:
            type: integer
        ratings:
          type: object
          description: "Per rating: overall or a category name"
          additionalProperties:
            type: integer
        mandatory:
          type: integer
        recommended:
          type: integer
        rating:
          type: integer
        verdict:
          type: integer
    KpiTargets:
      type: object
      description: "Target values per CHAOSS metric id: at least min, at most max. Durations in hours, release frequency in releases per 12 months. Informative only; proposals."
      additionalProperties:
        type: object
        properties:
          min:
            type: number
          max:
            type: number
    RepoMeta:
      type: object
      properties:
        description:
          type:
            - string
            - null
        language:
          type:
            - string
            - null
        stars:
          type: integer
        forks:
          type: integer
        defaultBranch:
          type: string
        topics:
          type: array
          items:
            type: string
        license:
          type:
            - string
            - null
        version:
          type:
            - string
            - null
        versionEvidence:
          type: object
          properties:
            source:
              type: string
              enum:
                - release
                - tag
                - manifest
                - readme
                - none
            detail:
              type: string
          required:
            - source
            - detail
      required:
        - description
        - language
        - stars
        - forks
        - defaultBranch
        - topics
        - license
        - version
        - versionEvidence
    CheckResult:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        requirementLevel:
          type: string
          enum:
            - mandatory
            - recommended
            - informative
        status:
          type: string
          enum:
            - pass
            - fail
            - warn
            - info
        message:
          type: string
        evidence:
          type: array
          items:
            type: string
        referenceUrl:
          type: string
        confidence:
          type: string
          enum:
            - high
            - medium
            - low
      required:
        - id
        - title
        - description
        - status
        - message
    CheckReport:
      type: object
      properties:
        repoUrl:
          type: string
        owner:
          type: string
        repo:
          type: string
        checkedAt:
          type: string
          format: date-time
        scoringConfigId:
          type:
            - string
            - null
        score:
          type: integer
        results:
          type: array
          items:
            $ref: "#/components/schemas/CheckResult"
        repoMeta:
          $ref: "#/components/schemas/RepoMeta"
      required:
        - repoUrl
        - owner
        - repo
        - checkedAt
        - score
        - results
        - repoMeta
